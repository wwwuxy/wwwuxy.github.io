<article class="lw-publication-card lw-project-card">
  <figure class="lw-research-paper__figure">
    <a href="{{ include.project.image }}" aria-label="查看{{ include.project.name }}界面大图">
      <img src="{{ include.project.image }}" width="{{ include.project.image_width }}" height="{{ include.project.image_height }}" loading="lazy" alt="{{ include.project.image_alt }}">
    </a>
  </figure>
  <div class="lw-publication-body">
    <h3 class="lw-publication-title"><a href="{{ include.project.url }}">{{ include.project.name }}</a></h3>
    {% if include.project.description %}<p class="lw-publication-citation">{{ include.project.description }}</p>{% endif %}
    <a class="lw-mini-link" href="{{ include.project.url }}">GitHub →</a>
  </div>
</article>
